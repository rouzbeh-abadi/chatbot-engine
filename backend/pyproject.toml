[project]
name = "support-agent"
version = "0.1.0"
description = "Travel support backend: app API, domain tools, and an HTTP client for the AI engine."
readme = "README.md"
requires-python = ">=3.13"
# No dependency on the engine package. The two services share an HTTP contract
# only -- `engine_client/models.py` mirrors it deliberately.
dependencies = [
    "alembic>=1.18",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28",
    "mcp>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    # The `asyncio` extra pulls in greenlet, which SQLAlchemy's async engine
    # needs at runtime and does not require by default.
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
