[project]
name = "support-agent"
version = "0.1.0"
description = "Travel support backend: app API, domain tools, and an HTTP client for the AI engine."
readme = "README.md"
requires-python = ">=3.13"
# No dependency on the engine package. The two services share an HTTP contract
# only -- `engine_client/models.py` mirrors it deliberately.
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28",
    # 2.x renamed FastMCP to MCPServer; mcp_tools.py uses the 2.x API.
    "mcp>=2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
