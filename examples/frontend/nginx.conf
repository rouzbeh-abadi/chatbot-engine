server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to anyone scanning.
    server_tokens off;

    # A stray upload or a stored answer must never be rendered as a page: the
    # app is entirely same-origin, so nothing here needs a third-party script,
    # a frame, or an object. `connect-src 'self'` is what keeps an injected
    # script from posting what it reads to somewhere else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No page here uses a camera, a microphone, or a location.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HSTS belongs on the TLS terminator, not here: this container speaks plain
    # HTTP to whatever sits in front of it, and sending HSTS over HTTP is
    # ignored at best. Set `Strict-Transport-Security` where TLS ends.

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same arrangement as Vite's dev proxy, so the browser sees one origin in
    # development and in the container, and the backend needs no CORS either way.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The backend buckets rate limits per client address, so it needs the
        # real one. Set rather than appended: a client that sends its own
        # X-Forwarded-For would otherwise choose its own bucket.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Identity is decided by the backend from this header, and it must be
        # this proxy's word, never the caller's. Cleared here so that a browser
        # sending X-User-Id cannot reach the backend with it; a deployment that
        # authenticates users replaces this line with the resolved id, and only
        # then sets BACKEND_TRUST_USER_HEADER=true.
        proxy_set_header X-User-Id "";

        # Uploads are capped at 25 MB by the backend and the engine; rejecting
        # here means an oversized body is dropped at the edge rather than
        # streamed across two services first.
        client_max_body_size 25m;

        # Server-sent events. Without these three the chat stream is buffered and
        # the whole answer lands at once instead of token by token -- nginx
        # buffers proxied responses by default, and it looks like the engine is
        # slow rather than like a proxy setting.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
