server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to anyone scanning.
    server_tokens off;

    # The visitor's own address, behind the TLS terminator the production
    # overlay puts in front of this container. Without it every visitor
    # arrives from the terminator's address, so the backend counts them all in
    # one rate-limit bucket and one visitor can use it up for everyone.
    #
    # The address is taken from X-Forwarded-For only on a connection from a
    # range listed here, and the header is read from the right, past every
    # listed address, so a client cannot pick its own by sending the header.
    # These are the private ranges a terminator connects from: through
    # Docker's gateway on the same host, from the compose network, or from a
    # cloud network. Narrow them to the terminator's own address once you know
    # it: whatever connects from a listed address may say who the visitor is.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # A stray upload or a stored answer must never be rendered as a page: the
    # app is entirely same-origin, so nothing here needs a third-party script,
    # a frame, or an object. `connect-src 'self'` is what keeps an injected
    # script from posting what it reads to somewhere else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No page here uses a camera, a microphone, or a location.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HSTS belongs on the TLS terminator, not here: this container speaks plain
    # HTTP to whatever sits in front of it, and sending HSTS over HTTP is
    # ignored at best. Set `Strict-Transport-Security` where TLS ends.

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same arrangement as Vite's dev proxy, so the browser sees one origin in
    # development and in the container, and the backend needs no CORS either way.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The backend buckets rate limits per client address, so it needs the
        # real one: $remote_addr, as resolved above. Set rather than appended:
        # a client that sends its own X-Forwarded-For would otherwise choose
        # its own bucket.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Identity is decided by the backend from this header, and it must be
        # this proxy's word, never the caller's. Cleared here so that a browser
        # sending X-User-Id cannot reach the backend with it; a deployment that
        # authenticates users replaces this line with the resolved id, and only
        # then sets BACKEND_TRUST_USER_HEADER=true.
        #
        # X-Client-Id is different: it is the browser's own id for long-term
        # memory, passes through untouched, and is never treated as identity.
        proxy_set_header X-User-Id "";

        # Uploads are capped at 25 MB by the backend and the engine; rejecting
        # here means an oversized body is dropped at the edge rather than
        # streamed across two services first.
        client_max_body_size 25m;

        # Server-sent events. Without these three the chat stream is buffered and
        # the whole answer lands at once instead of token by token -- nginx
        # buffers proxied responses by default, and it looks like the engine is
        # slow rather than like a proxy setting.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
