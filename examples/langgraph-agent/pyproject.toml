# A LangGraph agent for the chatbot engine, packaged as a plugin.
#
# It is deliberately NOT part of the engine. The engine defines what an agent
# is and how one is discovered; choosing LangGraph is an application decision,
# so it belongs to whoever is building the application. Adopters who want a
# different framework write their own package the same way and never touch the
# engine.
#
# Install it into the environment the engine runs in, and `agent: graph`
# becomes selectable.

[project]
name = "langgraph-agent"
version = "0.1.5"
description = "A LangGraph agent for the chatbot engine, provided as a plugin."
requires-python = ">=3.13"
dependencies = [
    "chatbot-engine",
    "langgraph>=0.2",
]

# The entry point is the whole integration. The engine looks up this group.
[project.entry-points."chatbot_engine.agents"]
graph = "langgraph_agent.agent:build"
workflow = "langgraph_agent.workflow:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langgraph_agent"]
