# Assistant configuration. The backend owns this file; the engine stores none
# of it and receives it inline with every request.
#
# Validated against the engine's wire contract on load, so a typo
# here fails on our side with our error message.
#
# Note: load_project() is cached -- restart the backend after editing.

project_id: support
name: Customer Support Assistant

# The prompt lives in its own file: it is long, has examples, and reads better
# as Markdown than as a YAML block. Path is relative to projects/prompts/.
system_prompt_file: system_prompt.md

model: openai/gpt-5-mini

# Which agent runs a turn: `loop`, the engine's own, or the name of a plugin
# installed into the engine, such as `graph` from examples/langgraph-agent.
# See docs/agents.md.
agent: loop
embedding_model: openai/text-embedding-3-small

# How the knowledge base is chunked: size | headings | page.
chunking_strategy: headings
chunk_size: 1000
chunk_overlap: 200
temperature: 0.2

# How many chunks reach the model per turn.
top_k: 5

# How they are found. `hybrid` fuses vector similarity with a keyword search,
# which catches exact terms (fare names, codes) that embeddings blur; `vector`
# is similarity alone. `rerank` has the model re-order the candidates first,
# at the cost of one extra model call per turn. See docs/retrieval.md.
retrieval: hybrid
rerank: false
retrieval_candidates: 20

# Bounds the agent's tool-calling loop.
max_tool_iterations: 6

# Tools reach the engine over MCP. The engine dials this URL and may call only
# the names listed here -- tool names and descriptions land in the prompt, so an
# open list would let the tool server inject instructions.
#
# Running under Docker Compose? The engine resolves service names, not
# localhost: change the host to `mcp-tools`.
mcp_servers:
  - name: support-tools
    url: http://localhost:8200/mcp
    allowed_tools:
      - get_booking_status
      - get_flight_status
      - create_support_ticket
      - remember
