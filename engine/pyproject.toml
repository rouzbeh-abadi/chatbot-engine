[project]
name = "chatbot-engine"
version = "0.1.1"
description = "A standalone RAG and MCP tool-calling service."
readme = "README.md"
license = "Apache-2.0"
# Kept inside the package: a wheel must carry the text, not just name it.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rouzbeh Abadi" }]
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-chroma",
    "langchain-core",
    "langchain-openai",
    "langchain-text-splitters",
    "mcp>=2.0",
    "prometheus-client>=0.20",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7",
    "pypdf>=6.16.1",
    "rank-bm25>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_engine"]

[project.optional-dependencies]
chroma = [
    "chromadb>=1.0",
]
# RAG evaluation with RAGAS. Heavy and eval-only, so kept out of the base
# install and imported lazily; installed in the image so the dashboard can run
# it. `langchain-community` is pinned in because ragas 0.4.3 imports from it.
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community>=0.4",
]
redis = [
    "redis>=5",
]
postgres = [
    "psycopg[binary]>=3.2",
]
s3 = [
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
