[project]
name = "chatbot-engine"
version = "0.1.0"
description = "A standalone RAG and MCP tool-calling service."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-chroma",
    "langchain-core",
    "langchain-openai",
    "langchain-text-splitters",
    "mcp>=2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7",
    "pypdf>=6.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_engine"]

[project.optional-dependencies]
chroma = [
    "chromadb>=1.0",
]
# RAG evaluation with RAGAS. Heavy and eval-only, so kept out of the base
# install and imported lazily; installed in the image so the dashboard can run
# it. `langchain-community` is pinned in because ragas 0.4.3 imports from it.
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"