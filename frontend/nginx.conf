server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same arrangement as Vite's dev proxy, so the browser sees one origin in
    # development and in the container, and the backend needs no CORS either way.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Server-sent events. Without these three the chat stream is buffered and
        # the whole answer lands at once instead of token by token -- nginx
        # buffers proxied responses by default, and it looks like the engine is
        # slow rather than like a proxy setting.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
