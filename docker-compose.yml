# The whole stack.
#
#   frontend :5173 -> backend :8000 --HTTP--> engine :8100
#                  |                       |
#                  |                       +--MCP--> mcp-tools :8200
#                  |                                       |
#                  +---------------------------------------+--> postgres :5432
#
# The backend and the tool server run the same image with different entrypoints:
# they share the models and the database, but one speaks HTTP and the other MCP.

name: chatbot-engine

services:
  # The built UI, served by nginx, which also proxies /api to the backend so the
  # browser only ever talks to one origin.
  frontend:
    build:
      context: ./examples/frontend
    ports:
      # This machine only, as every port this file publishes: it is the demo
      # stack, with demo passwords and no keys by default. The production
      # overlay is for anything reachable from elsewhere.
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  postgres:
    image: postgres:17
    ports:
      # This machine only: the password is committed to this repository.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: support_agent
      POSTGRES_USER: support_agent
      POSTGRES_PASSWORD: support_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_agent -d support_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      # The repository root, because the demo image is the engine plus this
      # repo's agent plugin -- the same thing an adopter builds. The engine's
      # own Dockerfile still builds a plain, framework-free image on its own.
      context: .
      dockerfile: docker/engine-with-plugins.Dockerfile
    # An init as PID 1: uvicorn ends a stop by raising the signal again, which
    # PID 1 ignores, and the init reaps the processes that read PDFs.
    init: true
    ports:
      # Published for /docs and curl, on this machine only: with no
      # ENGINE_API_KEY anyone who reaches the port spends the provider key. In
      # a real deployment only the backend needs to reach the engine.
      - "127.0.0.1:8100:8100"
    environment:
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      ENGINE_OPENROUTER_API_KEY: ${ENGINE_OPENROUTER_API_KEY:-}
      # The demo's price table, so the UI shows a cost. See .env.example.
      ENGINE_PRICING: ${ENGINE_PRICING:-}
      ENGINE_LOG_LEVEL: INFO
      # Inside the container, so it lands on the volume below rather than in a
      # layer that `docker compose down` throws away.
      ENGINE_CHROMA_DIR: /var/lib/chatbot-engine/chroma
      ENGINE_REGISTRY_DB: /var/lib/chatbot-engine/documents.sqlite3
      ENGINE_BLOB_DIR: /var/lib/chatbot-engine/blobs
      ENGINE_CHECKPOINT_DB: /var/lib/chatbot-engine/checkpoints.sqlite3
    volumes:
      # Vectors cost money to produce. Without this they are re-embedded from
      # scratch on every `docker compose up`.
      - engine_data:/var/lib/chatbot-engine
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # The repository root, so the build installs from uv.lock.
      context: .
      dockerfile: examples/backend/Dockerfile
    ports:
      # This machine only: with BACKEND_ADMIN_KEY unset, /admin and the
      # document write routes are open to whoever reaches the port.
      - "127.0.0.1:8000:8000"
    environment:
      BACKEND_ENGINE_URL: http://engine:8100
      BACKEND_ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      # Guards /admin. Unset leaves the dashboard open, which is only safe while
      # the published port is reachable from your machine alone.
      BACKEND_ADMIN_KEY: ${BACKEND_ADMIN_KEY:-}
      BACKEND_DATABASE_URL: postgresql+psycopg://support_agent:support_agent@postgres:5432/support_agent
      # The engine dials the tool server, so this has to be the service name
      # rather than localhost. Which tools are allowed stays in support.yaml.
      BACKEND_MCP_TOOLS_URL: http://mcp-tools:8200/mcp
      # The token the tool server asks for, which the engine is sent for that
      # server alone. Optional here, where the tool server's port is this
      # machine's only; the production overlay requires it.
      BACKEND_MCP_TOOLS_TOKEN: ${MCP_TOOLS_TOKEN:-}
    depends_on:
      engine:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # This project's domain tools, exposed to the engine over MCP.
  mcp-tools:
    build:
      context: .
      dockerfile: examples/backend/Dockerfile
    command: ["python", "-m", "support_agent.mcp_tools"]
    ports:
      # This machine only. The engine reaches it over the compose network; a
      # tool server takes its caller's word for who the customer is, so
      # nothing else should reach it.
      - "127.0.0.1:8200:8200"
    environment:
      BACKEND_DATABASE_URL: postgresql+psycopg://support_agent:support_agent@postgres:5432/support_agent
      # Every interface inside the container, so the engine's container can
      # reach it. It still answers only to the Host below and to loopback.
      BACKEND_MCP_TOOLS_HOST: 0.0.0.0
      BACKEND_MCP_TOOLS_URL: http://mcp-tools:8200/mcp
      BACKEND_MCP_TOOLS_TOKEN: ${MCP_TOOLS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  engine_data:
