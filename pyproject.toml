# Development workspace. The two services are independent deployables -- neither
# depends on the other's Python package -- but sharing one virtualenv keeps local
# work to a single `uv sync`.
#
# `tests/test_contract_parity.py` is the one place that imports both, on purpose:
# it is what catches the wire contract drifting between them.

[project]
name = "rabadi-ae-afa-3-5"
version = "0.1.0"
description = "A domain-specialised RAG chatbot with advanced retrieval and tool calling."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "support-agent",
    "chatbot-engine",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "backend"]

[tool.uv.sources]
support-agent = { workspace = true }
chatbot-engine = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "backend/tests", "tests"]
asyncio_mode = "auto"
