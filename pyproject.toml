# Development workspace. The two services are independent deployables -- neither
# depends on the other's Python package -- but sharing one virtualenv keeps local
# work to a single `uv sync`.
#
# `tests/test_contract_parity.py` is the one place that imports both, on purpose:
# it is what catches the wire contract drifting between them.

[project]
# Not "chatbot-engine": that name belongs to the engine package below, and a
# workspace root cannot depend on itself.
name = "chatbot-engine-workspace"
version = "0.1.0"
description = "Development workspace for the chatbot engine and its example application."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Rouzbeh Abadi" }]
requires-python = ">=3.13"
dependencies = [
    "support-agent",
    "chatbot-engine",
    # The LangGraph agent, installed the way an adopter installs one. A
    # dependency of the workspace, never of the engine: that is what keeps the
    # engine free of any agent framework.
    "langgraph-agent",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "examples/backend", "examples/langgraph-agent"]

[tool.uv.sources]
support-agent = { workspace = true }
chatbot-engine = { workspace = true }
langgraph-agent = { workspace = true }

[dependency-groups]
# langgraph is an optional extra for consumers, but a dev dependency here so the
# graph agent is exercised by the suite rather than skipped.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "langgraph>=0.2",
    "fakeredis[lua]>=2.20",
    "ruff>=0.14",
    "ty>=0.0.1a0",
]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "examples/backend/tests", "tests"]
asyncio_mode = "auto"

# One configuration for the whole workspace, so CI and a laptop agree on what
# passes. Explicit rather than ruff's defaults, which a user-level config can
# widen without anyone noticing.
[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["examples/backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",   # errors and undefined names
    "I",                     # import order
    "B",                     # likely bugs
    "UP",                    # modern syntax
    "SIM",                   # simplifications
    "RUF",                   # ruff's own checks
]
ignore = [
    "B008",   # FastAPI's Depends(), File() and Form() are called in defaults by design
    "RUF012", # pydantic and test doubles use class-level mutable defaults
]

[tool.ruff.lint.isort]
known-first-party = ["chatbot_engine", "support_agent", "langgraph_agent"]
