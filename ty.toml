# Type-checker (ty) configuration.
#
# The two services live under src layouts (examples/backend/src, engine/src) and are the
# first-party roots. Declaring them here makes module names canonical -- e.g.
# `support_agent.api.schemas`, never `examples.backend.src.support_agent.api.schemas`.
# Without it an editor walking from the repo root sees each module under two
# names and reports spurious type mismatches between them.

[environment]
root = ["examples/backend/src", "engine/src"]

[rules]
# Optional extras the checker cannot always see are reported, not fatal; the
# checks that matter are the ones on our own code.
unresolved-import = "warn"
