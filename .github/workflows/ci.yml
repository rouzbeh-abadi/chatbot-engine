# Tests and image builds on every push and pull request.
#
# Deliberately not a deploy pipeline: this is a package other people run, so CI
# proves the thing builds and passes its own tests, and stops short of assuming
# where it lands.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    # A real Postgres, so the tests that need one (the backend's tools and
    # memory, the engine's shared registry) run here rather than only on a
    # laptop that happens to have the demo stack up. They skip without it,
    # which is how 27 of them went unrun for a week.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: support_agent
          POSTGRES_USER: support_agent
          POSTGRES_PASSWORD: support_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_agent -d support_agent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKEND_DATABASE_URL: postgresql+psycopg://support_agent:support_agent@localhost:5432/support_agent
      ENGINE_TEST_POSTGRES_URL: postgresql://support_agent:support_agent@localhost:5432/support_agent
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Every extra, so the type checker sees the optional dependencies too.
      - run: uv sync --all-packages --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run ty check --exit-zero-on-warning engine/src examples/backend/src examples/langgraph-agent

      - name: Migrate the test database
        run: uv run alembic -c examples/backend/alembic.ini upgrade head

      # No .env is created, on purpose: the suite must pass on a machine with no
      # configuration at all, which is the same promise `make dev` makes.
      - name: Run the engine and backend tests
        run: uv run pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: examples/frontend/package-lock.json

      - run: npm ci

      # Type errors do not fail vitest, so the compiler runs on its own.
      - name: Type-check
        run: npx tsc --noEmit

      - run: npm run test

      - name: Build the production bundle
        run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python images build from the repository root so they install
          # from uv.lock; the frontend builds from its own directory.
          - name: engine
            context: .
            dockerfile: engine/Dockerfile
          - name: backend
            context: .
            dockerfile: examples/backend/Dockerfile
          - name: frontend
            context: ./examples/frontend
            dockerfile: examples/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5

      # Built but not pushed: a Dockerfile that stopped building is a broken
      # deployment, and it is worth catching here rather than at deploy time.
      - name: Build the ${{ matrix.name }} image
        run: docker build -f ${{ matrix.dockerfile }} ${{ matrix.context }}

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The demo stack resolves
        run: docker compose -f docker-compose.yml config --quiet

      - name: The production overlay resolves, and demands its secrets
        env:
          POSTGRES_PASSWORD: ci-placeholder
          ENGINE_API_KEY: ci-placeholder
          BACKEND_ADMIN_KEY: ci-placeholder
          ENGINE_OPENROUTER_API_KEY: ci-placeholder
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: The production overlay refuses to resolve without them
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo "the overlay resolved with no secrets set -- a required variable lost its ':?' guard"
            exit 1
          fi
