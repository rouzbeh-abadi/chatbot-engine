# Publish container images when a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Images land in this repository's GitHub Container Registry:
#
#   ghcr.io/<owner>/chatbot-engine/engine
#   ghcr.io/<owner>/chatbot-engine/engine-langgraph
#   ghcr.io/<owner>/chatbot-engine/backend
#   ghcr.io/<owner>/chatbot-engine/frontend
#
# The engine is the reusable part; engine-langgraph is the same engine with the
# LangGraph plugin installed (the `graph` and `workflow` agents). The other two
# are the example app, published alongside so the whole stack can be run from a
# compose file without a build.
#
# Nothing here deploys anywhere. This is a package, so where it runs is the
# adopter's decision; see DEPLOYMENT.md.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Lets you rehearse the whole thing against a branch before cutting a tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read the repository; the jobs that publish ask for more themselves.
permissions:
  contents: read

jobs:
  # The tag is only worth publishing if it passes what `main` has to pass: a
  # tag can point at any commit, including one that never ran through a pull
  # request. So the release runs CI itself, the whole of it (Postgres, every
  # extra, lint, formatting, types, the tests, the images and the compose
  # files), rather than a copy of some of its steps that drifts.
  verify:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python images build from the repository root so they install
          # from uv.lock; the frontend builds from its own directory.
          - service: engine
            context: .
            dockerfile: engine/Dockerfile
          - service: engine-langgraph
            context: .
            dockerfile: docker/engine-with-plugins.Dockerfile
          - service: backend
            context: .
            dockerfile: examples/backend/Dockerfile
          - service: frontend
            context: ./examples/frontend
            dockerfile: examples/frontend/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # arm64 is built under emulation, which is slow but means the images run
      # unchanged on Apple silicon and Graviton.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          # v1.4.2 publishes 1.4.2, 1.4, 1 and latest, so an adopter can pin as
          # loosely or as tightly as they want. `latest` only moves on a real
          # tag -- never on a manual run.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          # A manual run builds everything but publishes nothing, so the
          # workflow can be rehearsed without moving any tag.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    name: GitHub release
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Release notes are generated from the commits since the last tag, so
          # a shallow clone would produce an empty changelog.
          fetch-depth: 0

      # The tag reaches the shell through `VERSION`, never spliced into the
      # script: a tag name is text someone chose.
      #
      # Two steps rather than one clever invocation: `--generate-notes` and
      # `--notes` are used separately here, so neither depends on how gh chooses
      # to merge them. The body is read back and appended to.
      #
      # Both steps can run again for the same tag: one tag push has started this
      # workflow twice (v0.1.21), and the concurrency group only queues the second
      # run, so it finds the release already made and its notes already complete.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: gh release view "$VERSION" > /dev/null 2>&1 || gh release create "$VERSION" --generate-notes

      - name: Add the image coordinates to the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # The image tags carry no leading v: metadata-action publishes
          # v0.1.0 as 0.1.0, 0.1 and 0.
          tag="${VERSION#v}"
          notes=$(gh release view "$VERSION" --json body --jq .body)
          case "$notes" in *"## Container images"*) exit 0 ;; esac
          gh release edit "$VERSION" --notes "$notes

          ## Container images

          \`\`\`
          ghcr.io/$REPO/engine:$tag
          ghcr.io/$REPO/engine-langgraph:$tag
          ghcr.io/$REPO/backend:$tag
          ghcr.io/$REPO/frontend:$tag
          \`\`\`

          Running this where other people can reach it: see [DEPLOYMENT.md](https://github.com/$REPO/blob/$VERSION/DEPLOYMENT.md)."
